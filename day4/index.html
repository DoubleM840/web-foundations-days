<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes - Day 4</title>
    <!-- Reuse your professional Day 2 styling -->
    <link rel="stylesheet" href="../day2/style.css">
    
    <!-- Day 4 Specific Styles for Note Layout -->
    <style>
        .note {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
        }
        
        .note span {
            flex: 1;
            word-break: break-word;
        }

        .delete-btn {
            background-color: #8e0000;
            color: white;
            border: none;
            padding: 6px 12px;
            font-size: 0.85rem;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .delete-btn:hover {
            background-color: #6b0000;
        }
    </style>

    <!-- defer is MANDATORY: waits for HTML to load before running JS -->
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>QuickNotes</h1>
        <p>Capture ideas before they disappear.</p>
    </header>
    
    <main>
        <section>
            <h2>Add a note</h2>
            <!-- IDs must EXACTLY match querySelector in script.js -->
            <form id="note-form">
                <input type="text" id="note-input" placeholder="Type a note..." required />
                <button type="submit">Add Note</button>
            </form>
        </section>
        
        <section>
            <h2>Your notes</h2>
            <p id="note-count">You have 0 notes.</p>
            <!-- EMPTY LIST: JavaScript will populate this dynamically -->
            <ul id="notes-list"></ul>
        </section>
    </main>
</body>
</html>
