<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 5: User Directory & API Design</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
        button { padding: 0.75rem 1.5rem; cursor: pointer; border: none; border-radius: 6px; background: #0ba184; color: white; font-size: 1rem; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        input { padding: 0.75rem; width: 100%; box-sizing: border-box; margin: 1rem 0; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; }
        ul { list-style: none; padding: 0; }
        li { padding: 1rem; border-bottom: 1px solid #eee; }
        li strong { display: block; font-size: 1.1rem; margin-bottom: 0.25rem; }
        li span { color: #666; font-size: 0.9rem; }
        #status { min-height: 1.5rem; margin: 1rem 0; font-weight: bold; }
        .error { color: #c0392b; }
        .success { color: #0ba184; }
    </style>
    <script src="users.js" defer></script>
</head>
<body>
    <h1>User Directory</h1>
    
    <button id="load-users">Load Users from API</button>
    
    <p id="status"></p>
    
    <label for="filter-input" style="display:none;">Filter users by name</label>
    <input type="text" id="filter-input" placeholder="Type to filter users by name..." disabled />
    
    <ul id="users-list"></ul>
</body>
</html>
